<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D3 Force Graph Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #25272d;
        --panel: rgba(18, 20, 24, 0.62);
        --ink: #f7fbff;
        --muted: #a7b0bf;
        --line: rgba(255, 255, 255, 0.12);
        --glow: rgba(80, 230, 255, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 48%, rgba(126, 238, 255, 0.11), transparent 34%),
          radial-gradient(circle at 24% 28%, rgba(185, 255, 107, 0.08), transparent 30%),
          radial-gradient(circle at 78% 70%, rgba(255, 111, 177, 0.08), transparent 34%),
          var(--bg);
        color: var(--ink);
        font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0;
      }

      .graph-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .graph-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }

      .graph-canvas.is-panning {
        cursor: grabbing;
      }

      .graph-canvas.is-dragging-node {
        cursor: grabbing;
      }

      .hud {
        position: absolute;
        top: 18px;
        left: 18px;
        display: grid;
        gap: 8px;
        max-width: min(420px, calc(100vw - 36px));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
        pointer-events: none;
      }

      .hud h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }

      .hud p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .legend {
        position: absolute;
        right: 18px;
        bottom: 18px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        max-width: min(560px, calc(100vw - 36px));
        pointer-events: none;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(20, 24, 28, 0.68);
        padding: 0 10px;
        color: #eaf3ff;
        font-size: 12px;
        font-weight: 700;
        backdrop-filter: blur(10px);
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 16px currentColor;
      }

      .link {
        filter: url(#neon-link-glow);
        stroke: rgba(205, 224, 235, 0.24);
        stroke-linecap: round;
        stroke-width: 1.1;
        vector-effect: non-scaling-stroke;
        transition: opacity 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
      }

      .node {
        cursor: grab;
      }

      .node:active {
        cursor: grabbing;
      }

      .node-core {
        stroke: rgba(255, 255, 255, 0.46);
        stroke-width: 0.8;
        filter: url(#neon-node-glow);
        transition: opacity 160ms ease, stroke-width 160ms ease, filter 160ms ease;
      }

      .node-label {
        fill: rgba(255, 255, 255, 0.92);
        font-size: 10.5px;
        font-weight: 800;
        paint-order: stroke;
        pointer-events: none;
        stroke: rgba(30, 32, 38, 0.9);
        stroke-linejoin: round;
        stroke-width: 4px;
        text-anchor: middle;
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .node.is-fixed .node-core {
        stroke: #ffffff;
        stroke-width: 2.2;
      }

      .node.is-dragging .node-core {
        stroke: #ffffff;
        stroke-width: 3.2;
        filter: url(#neon-drag-glow);
      }

      .node.is-highlighted .node-core {
        stroke: #ffffff;
        stroke-width: 2.8;
        filter: url(#neon-drag-glow);
      }

      .link.is-highlighted {
        filter: url(#neon-link-hot-glow);
        stroke: #8feeff;
        stroke-width: 2.2;
      }

      .is-dimmed {
        opacity: 0.1;
      }

      .load-error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        color: #ffffff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="graph-shell">
      <svg id="graph" class="graph-canvas" role="img" aria-label="筋トレと栄養学のネットワークグラフ"></svg>
      <section class="hud" aria-label="グラフ情報">
        <h1>筋トレと栄養学</h1>
        <p>Force-directed network / D3 v7</p>
      </section>
      <div class="legend" id="legend" aria-label="カテゴリ"></div>
      <div class="load-error" id="load-error">D3.jsを読み込めませんでした。</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      (() => {
        const fallback = document.querySelector("#load-error");
        if (!window.d3) {
          fallback.style.display = "grid";
          return;
        }

        const groups = {
          training: { label: "トレーニング", color: "#d6ff5d" },
          nutrition: { label: "栄養", color: "#f1e58a" },
          recovery: { label: "回復", color: "#6ee7ff" },
          supplement: { label: "サプリ", color: "#ff5f92" },
          physiology: { label: "身体反応", color: "#8effa5" }
        };

        const nodes = [
          { id: "筋肥大", group: "physiology" },
          { id: "筋力向上", group: "training" },
          { id: "高重量トレーニング", group: "training" },
          { id: "漸進性過負荷", group: "training" },
          { id: "ボリューム", group: "training" },
          { id: "頻度", group: "training" },
          { id: "コンパウンド種目", group: "training" },
          { id: "スクワット", group: "training" },
          { id: "ベンチプレス", group: "training" },
          { id: "デッドリフト", group: "training" },
          { id: "可動域", group: "training" },
          { id: "フォーム", group: "training" },
          { id: "タンパク質", group: "nutrition" },
          { id: "プロテイン", group: "supplement" },
          { id: "アミノ酸", group: "nutrition" },
          { id: "BCAA", group: "supplement" },
          { id: "EAA", group: "supplement" },
          { id: "ロイシン", group: "nutrition" },
          { id: "炭水化物", group: "nutrition" },
          { id: "グリコーゲン", group: "physiology" },
          { id: "脂質", group: "nutrition" },
          { id: "カロリー収支", group: "nutrition" },
          { id: "増量期", group: "nutrition" },
          { id: "減量期", group: "nutrition" },
          { id: "クレアチン", group: "supplement" },
          { id: "カフェイン", group: "supplement" },
          { id: "水分補給", group: "nutrition" },
          { id: "電解質", group: "nutrition" },
          { id: "パフォーマンス", group: "physiology" },
          { id: "睡眠", group: "recovery" },
          { id: "休養", group: "recovery" },
          { id: "超回復", group: "recovery" },
          { id: "ストレス", group: "recovery" },
          { id: "コルチゾール", group: "physiology" },
          { id: "テストステロン", group: "physiology" },
          { id: "インスリン", group: "physiology" },
          { id: "筋タンパク合成", group: "physiology" },
          { id: "筋損傷", group: "physiology" },
          { id: "ウォームアップ", group: "training" }
        ];

        const links = [
          ["筋肥大", "筋タンパク合成"], ["筋肥大", "漸進性過負荷"], ["筋肥大", "タンパク質"], ["筋肥大", "睡眠"],
          ["筋肥大", "ボリューム"], ["筋肥大", "超回復"], ["筋力向上", "高重量トレーニング"], ["筋力向上", "コンパウンド種目"],
          ["高重量トレーニング", "フォーム"], ["高重量トレーニング", "ウォームアップ"], ["漸進性過負荷", "ボリューム"],
          ["漸進性過負荷", "頻度"], ["コンパウンド種目", "スクワット"], ["コンパウンド種目", "ベンチプレス"],
          ["コンパウンド種目", "デッドリフト"], ["スクワット", "可動域"], ["ベンチプレス", "フォーム"], ["デッドリフト", "フォーム"],
          ["タンパク質", "プロテイン"], ["タンパク質", "アミノ酸"], ["タンパク質", "筋タンパク合成"], ["プロテイン", "ロイシン"],
          ["アミノ酸", "BCAA"], ["アミノ酸", "EAA"], ["BCAA", "ロイシン"], ["EAA", "ロイシン"], ["ロイシン", "筋タンパク合成"],
          ["炭水化物", "グリコーゲン"], ["グリコーゲン", "高重量トレーニング"], ["炭水化物", "インスリン"], ["インスリン", "筋タンパク合成"],
          ["脂質", "テストステロン"], ["カロリー収支", "増量期"], ["カロリー収支", "減量期"], ["増量期", "筋肥大"],
          ["減量期", "タンパク質"], ["クレアチン", "筋力向上"], ["クレアチン", "グリコーゲン"], ["カフェイン", "高重量トレーニング"],
          ["カフェイン", "ストレス"], ["水分補給", "電解質"], ["水分補給", "パフォーマンス"], ["睡眠", "テストステロン"],
          ["睡眠", "コルチゾール"], ["休養", "超回復"], ["休養", "筋損傷"], ["筋損傷", "超回復"], ["ストレス", "コルチゾール"],
          ["コルチゾール", "筋タンパク合成"], ["テストステロン", "筋タンパク合成"], ["頻度", "休養"], ["ボリューム", "筋損傷"],
          ["ウォームアップ", "可動域"], ["フォーム", "筋損傷"], ["電解質", "パフォーマンス"], ["パフォーマンス", "筋力向上"]
        ]
          .filter(([source, target]) => nodes.some((node) => node.id === source) && nodes.some((node) => node.id === target))
          .map(([source, target]) => ({ source, target }));

        const degree = new Map(nodes.map((node) => [node.id, 0]));
        links.forEach((link) => {
          degree.set(link.source, (degree.get(link.source) || 0) + 1);
          degree.set(link.target, (degree.get(link.target) || 0) + 1);
        });
        const maxDegree = Math.max(...degree.values());
        const radius = d3.scaleSqrt().domain([0, maxDegree]).range([4.5, 15]);

        const neighbors = new Map(nodes.map((node) => [node.id, new Set([node.id])]));
        links.forEach((link) => {
          neighbors.get(link.source).add(link.target);
          neighbors.get(link.target).add(link.source);
        });
        let draggedNode = null;
        let activeFocusId = null;
        let currentZoom = 1;

        const svg = d3.select("#graph");
        const defs = svg.append("defs");
        defs.append("filter")
          .attr("id", "neon-node-glow")
          .attr("x", "-120%")
          .attr("y", "-120%")
          .attr("width", "340%")
          .attr("height", "340%")
          .html(`
            <feGaussianBlur stdDeviation="2.2" result="softGlow"></feGaussianBlur>
            <feGaussianBlur stdDeviation="5.2" result="wideGlow"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="wideGlow"></feMergeNode>
              <feMergeNode in="softGlow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          `);
        defs.append("filter")
          .attr("id", "neon-drag-glow")
          .attr("x", "-170%")
          .attr("y", "-170%")
          .attr("width", "440%")
          .attr("height", "440%")
          .html(`
            <feGaussianBlur stdDeviation="4.2" result="softGlow"></feGaussianBlur>
            <feGaussianBlur stdDeviation="11" result="wideGlow"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="wideGlow"></feMergeNode>
              <feMergeNode in="softGlow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          `);
        defs.append("filter")
          .attr("id", "neon-link-glow")
          .attr("x", "-80%")
          .attr("y", "-80%")
          .attr("width", "260%")
          .attr("height", "260%")
          .html(`
            <feGaussianBlur stdDeviation="1.3" result="softGlow"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="softGlow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          `);
        defs.append("filter")
          .attr("id", "neon-link-hot-glow")
          .attr("x", "-110%")
          .attr("y", "-110%")
          .attr("width", "320%")
          .attr("height", "320%")
          .html(`
            <feGaussianBlur stdDeviation="3" result="softGlow"></feGaussianBlur>
            <feGaussianBlur stdDeviation="7" result="wideGlow"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="wideGlow"></feMergeNode>
              <feMergeNode in="softGlow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          `);
        const root = svg.append("g");
        const linkLayer = root.append("g").attr("class", "link-layer");
        const nodeLayer = root.append("g").attr("class", "node-layer");
        const labelLayer = root.append("g").attr("class", "label-layer");

        const link = linkLayer.selectAll("line")
          .data(links)
          .join("line")
          .attr("class", "link");

        const node = nodeLayer.selectAll("g")
          .data(nodes)
          .join("g")
          .attr("class", "node")
          .call(d3.drag()
            .on("start", dragStarted)
            .on("drag", dragged)
            .on("end", dragEnded));

        node.append("circle")
          .attr("class", "node-core")
          .attr("r", (d) => radius(degree.get(d.id) || 0))
          .attr("fill", (d) => groups[d.group].color)
          .style("color", (d) => groups[d.group].color);

        const label = labelLayer.selectAll("text")
          .data(nodes)
          .join("text")
          .attr("class", "node-label")
          .text((d) => d.id);

        node.on("mouseenter", (_, d) => highlight(d.id))
          .on("mouseleave", () => {
            if (activeFocusId) {
              highlight(activeFocusId);
              return;
            }
            clearHighlight();
          })
          .on("click", (event, d) => {
            event.stopPropagation();
            activeFocusId = activeFocusId === d.id ? null : d.id;
            if (activeFocusId) {
              highlight(activeFocusId);
            } else {
              clearHighlight();
            }
            updateLabelVisibility();
          })
          .on("dblclick", (event, d) => {
            event.stopPropagation();
            d.fx = null;
            d.fy = null;
            d3.select(event.currentTarget).classed("is-fixed", false);
            simulation.alpha(0.55).restart();
          });

        const simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(links).id((d) => d.id).distance((d) => {
            const a = degree.get(d.source.id || d.source) || 1;
            const b = degree.get(d.target.id || d.target) || 1;
            return 112 + Math.max(a, b) * 6;
          }).strength(0.28))
          .force("charge", d3.forceManyBody().strength((d) => -330 - (degree.get(d.id) || 0) * 46))
          .force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2).strength(0.08))
          .force("collision", d3.forceCollide().radius(collisionRadius).strength(0.95).iterations(2))
          .force("avoidDragged", forceAvoidDragged().strength(0.9).padding(70))
          .alpha(1)
          .alphaDecay(0.018)
          .velocityDecay(0.29)
          .on("tick", ticked);

        const zoom = d3.zoom()
          .scaleExtent([0.18, 4.8])
          .on("start", () => svg.classed("is-panning", true))
          .on("zoom", (event) => {
            root.attr("transform", event.transform);
            currentZoom = event.transform.k;
            updateLabelVisibility();
          })
          .on("end", () => svg.classed("is-panning", false));
        svg.call(zoom);
        svg.on("click", () => {
          activeFocusId = null;
          clearHighlight();
          updateLabelVisibility();
        });

        renderLegend();
        resize();
        updateLabelVisibility();
        window.addEventListener("resize", resize);

        function ticked() {
          link
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
          node.attr("transform", (d) => `translate(${d.x},${d.y})`);
          label
            .attr("x", (d) => d.x)
            .attr("y", (d) => d.y + radius(degree.get(d.id) || 0) + 15);
        }

        function highlight(id) {
          const activeNode = nodes.find((nodeDatum) => nodeDatum.id === id);
          const active = neighbors.get(id) || new Set([id]);
          node
            .classed("is-highlighted", (d) => active.has(d.id))
            .classed("is-dimmed", (d) => !active.has(d.id));
          label
            .classed("is-highlighted", (d) => active.has(d.id))
            .classed("is-dimmed", (d) => !active.has(d.id));
          link
            .classed("is-highlighted", (d) => (d.source.id === id || d.target.id === id))
            .classed("is-dimmed", (d) => !(d.source.id === id || d.target.id === id));
          if (activeNode) {
            simulation.alphaTarget(0.12).restart();
            window.setTimeout(() => {
              if (!draggedNode) {
                simulation.alphaTarget(0);
              }
            }, 260);
          }
          updateLabelVisibility();
        }

        function clearHighlight() {
          node.classed("is-highlighted", false).classed("is-dimmed", false);
          label.classed("is-highlighted", false).classed("is-dimmed", false);
          link.classed("is-highlighted", false).classed("is-dimmed", false);
        }

        function updateLabelVisibility() {
          const zoomOpacity = Math.max(0, Math.min(1, (currentZoom - 0.72) / 0.46));
          const degreeOpacity = Math.max(0, Math.min(1, (currentZoom - 0.45) / 0.38));
          label.style("opacity", (d) => {
            if (activeFocusId) {
              const active = neighbors.get(activeFocusId) || new Set([activeFocusId]);
              return active.has(d.id) ? 1 : 0.08;
            }
            const score = degree.get(d.id) || 0;
            return score >= 4 ? Math.max(0.34, degreeOpacity) : zoomOpacity;
          });
        }

        function dragStarted(event, d) {
          draggedNode = d;
          if (!event.active) {
            simulation.alphaTarget(0.48).restart();
          }
          d.fx = d.x;
          d.fy = d.y;
          d3.select(this).classed("is-fixed", true).classed("is-dragging", true);
          svg.classed("is-dragging-node", true);
          simulation.force("collision").radius(collisionRadius);
        }

        function dragged(event, d) {
          d.fx = event.x;
          d.fy = event.y;
          simulation.alpha(Math.max(simulation.alpha(), 0.38)).restart();
        }

        function dragEnded(event, d) {
          draggedNode = null;
          if (!event.active) {
            simulation.alphaTarget(0.08);
            window.setTimeout(() => simulation.alphaTarget(0), 240);
          }
          d.fx = event.x;
          d.fy = event.y;
          d3.select(this).classed("is-dragging", false);
          svg.classed("is-dragging-node", false);
          simulation.force("collision").radius(collisionRadius);
        }

        function collisionRadius(d) {
          const base = radius(degree.get(d.id) || 0) + 24;
          return draggedNode && d.id === draggedNode.id ? base + 36 : base;
        }

        function forceAvoidDragged() {
          let forceNodes = [];
          let forceStrength = 0.8;
          let forcePadding = 52;

          function force(alpha) {
            if (!draggedNode) {
              return;
            }
            const draggedRadius = radius(degree.get(draggedNode.id) || 0);
            forceNodes.forEach((nodeDatum) => {
              if (nodeDatum === draggedNode) {
                return;
              }
              const nodeRadius = radius(degree.get(nodeDatum.id) || 0);
              let dx = nodeDatum.x - draggedNode.x;
              let dy = nodeDatum.y - draggedNode.y;
              let distance = Math.hypot(dx, dy);
              if (distance === 0) {
                dx = 0.01;
                dy = 0.01;
                distance = 0.014;
              }
              const desiredDistance = draggedRadius + nodeRadius + forcePadding;
              if (distance >= desiredDistance) {
                return;
              }
              const pressure = ((desiredDistance - distance) / desiredDistance) * forceStrength * alpha * 18;
              nodeDatum.vx += (dx / distance) * pressure;
              nodeDatum.vy += (dy / distance) * pressure;
            });
          }

          force.initialize = (nextNodes) => {
            forceNodes = nextNodes;
          };
          force.strength = (value) => {
            if (value === undefined) {
              return forceStrength;
            }
            forceStrength = value;
            return force;
          };
          force.padding = (value) => {
            if (value === undefined) {
              return forcePadding;
            }
            forcePadding = value;
            return force;
          };
          return force;
        }

        function resize() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          svg.attr("viewBox", [0, 0, width, height]);
          simulation.force("center", d3.forceCenter(width / 2, height / 2).strength(0.08));
          simulation.alpha(0.28).restart();
        }

        function renderLegend() {
          const legend = d3.select("#legend");
          legend.selectAll("span")
            .data(Object.entries(groups))
            .join("span")
            .attr("class", "legend-item")
            .html(([, group]) => `<i class="legend-swatch" style="background:${group.color};color:${group.color}"></i>${group.label}`);
        }
      })();
    </script>
  </body>
</html>
